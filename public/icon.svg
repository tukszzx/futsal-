<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="courtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="ballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- App Icon Background (Squircle with Safe Zone) -->
  <rect width="512" height="512" rx="112" fill="url(#courtGrad)" />

  <!-- Inner Safe Zone Court Frame -->
  <rect x="56" y="56" width="400" height="400" rx="48" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="4" />

  <!-- Tactical Futsal Court Markings -->
  <rect x="76" y="96" width="360" height="320" rx="16" fill="rgba(2,132,199,0.35)" stroke="#ffffff" stroke-width="6" opacity="0.9" filter="url(#glow)" />
  <line x1="256" y1="96" x2="256" y2="416" stroke="#ffffff" stroke-width="5" opacity="0.9" />
  <circle cx="256" cy="256" r="64" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.9" />
  <circle cx="256" cy="256" r="6" fill="#ffffff" />

  <!-- Penalty Areas -->
  <path d="M 76 160 A 80 80 0 0 1 156 220 L 156 292 A 80 80 0 0 1 76 352" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.85" />
  <path d="M 436 160 A 80 80 0 0 0 356 220 L 356 292 A 80 80 0 0 0 436 352" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.85" />

  <!-- Tactical Play Arrow -->
  <path d="M 170 340 Q 256 360 330 300" fill="none" stroke="#fbbf24" stroke-width="8" stroke-dasharray="12,8" stroke-linecap="round" />
  <polygon points="342,290 326,294 332,310" fill="#fbbf24" />

  <!-- Futsal Ball in Center/Right with Shadow -->
  <g filter="url(#glow)">
    <circle cx="256" cy="256" r="48" fill="url(#ballGrad)" stroke="#ffffff" stroke-width="4" />
    <!-- Ball star / pentagon pattern -->
    <polygon points="256,224 286,246 274,282 238,282 226,246" fill="#0f172a" opacity="0.85" />
  </g>
</svg>
